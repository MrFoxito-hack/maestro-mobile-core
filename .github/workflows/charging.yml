name: Charging acceptance (experimental Rel16 profile)
on:
  pull_request:
    paths: ['chf/**', 'infra/charging/**', '.github/workflows/charging.yml']
  push:
    paths: ['chf/**', 'infra/charging/**', '.github/workflows/charging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r chf/requirements-dev.txt
      - run: python chf/tools/fetch_contract.py
      - run: python -m pytest -q
        working-directory: chf
      - name: Audit resolved runtime requirements
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r chf/requirements.txt
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build dependencies (no NF installed or started)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv ninja-build build-essential flex bison git libsctp-dev libgnutls28-dev libgcrypt-dev libssl-dev libidn11-dev libmongoc-dev libbson-dev libyaml-dev libnghttp2-dev libmicrohttpd-dev libcurl4-gnutls-dev libtins-dev libtalloc-dev meson
      - name: Exact upstream source and downstream patch
        run: |
          mkdir -p .work/native/.work
          git init .work/native/open5gs
          git -C .work/native/open5gs fetch --depth 1 https://github.com/open5gs/open5gs.git 157f611a530e292e40ec50f9d23f0ef5d4fcd6a6
          git -C .work/native/open5gs checkout --detach FETCH_HEAD
          git -C .work/native/open5gs apply --check "$GITHUB_WORKSPACE/infra/charging/patches/0001-native-nchf.patch"
          git -C .work/native/open5gs apply "$GITHUB_WORKSPACE/infra/charging/patches/0001-native-nchf.patch"
      - name: Compile and native regression
        run: |
          meson setup .work/native/open5gs/build .work/native/open5gs --buildtype=debugoptimized
          ninja -C .work/native/open5gs/build -j 2 src/smf/open5gs-smfd src/smf/chf-unit src/smf/chf-probe src/upf/open5gs-upfd src/upf/quota-unit
          meson test -C .work/native/open5gs/build --suite charging --print-errorlogs
      - name: Real HTTP2 component tests (explicit usage fixtures, not UE evidence)
        run: |
          cp -r chf .work/native/chf
          python3 -m venv .work/native/chf/.venv
          .work/native/chf/.venv/bin/python -m pip install -r .work/native/chf/requirements-dev.txt
          .work/native/chf/.venv/bin/python .work/native/chf/tools/fetch_contract.py
          .work/native/chf/.venv/bin/python .work/native/chf/tools/native_acceptance.py
          .work/native/chf/.venv/bin/python .work/native/chf/tools/native_terminal_acceptance.py
