services:
  backend:
    build: ./backend
    environment:
      EMS_EXECUTION_MODE: simulated
      EMS_SECRET_KEY: local-compose-key-change-before-sharing
      EMS_DATABASE_PATH: /app/data/ems.db
      EMS_CAPTURE_DIR: /app/data/captures
      EMS_BACKUP_DIR: /app/data/backups
      EMS_ALLOWED_CONFIG_ROOTS: '["/app/data/testbed-config"]'
      EMS_ALLOWED_INTERFACES: '["lo","ogstun"]'
    volumes:
      - ems-data:/app/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8080:80"
  chf:
    build: ./chf
    environment:
      CHF_DATABASE_PATH: /app/data/chf.db
      CHF_DEFAULT_GRANT_BYTES: 10485760
      CHF_VALIDITY_TIME_SECONDS: 300
    volumes:
      - chf-data:/app/data
    ports:
      - "127.0.0.1:8081:8081"
volumes:
  ems-data:
  chf-data:
