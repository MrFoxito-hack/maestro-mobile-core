services:
  backend:
    build: ./backend
    environment:
      EMS_EXECUTION_MODE: simulated
      EMS_SECRET_KEY: local-compose-key-change-before-sharing
      EMS_DATABASE_PATH: /app/data/ems.db
      EMS_CAPTURE_DIR: /app/data/captures
      EMS_BACKUP_DIR: /app/data/backups
      EMS_ALLOWED_CONFIG_ROOTS: '["/app/data/testbed-config"]'
      EMS_ALLOWED_INTERFACES: '["lo","ogstun"]'
    volumes:
      - ems-data:/app/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8080:80"
  laboratory-worker:
    build: ./backend
    command: ["python", "-m", "app.laboratory.worker"]
    environment:
      EMS_DATABASE_PATH: /app/data/ems.db
      EMS_LABORATORY_DATABASE_PATH: /app/data/laboratory.db
    volumes:
      - ems-data:/app/data
    restart: unless-stopped
    stop_grace_period: 15s
  laboratory-watchdog:
    build: ./backend
    command: ["python", "-m", "app.laboratory.worker", "--watchdog-only"]
    environment:
      EMS_DATABASE_PATH: /app/data/ems.db
      EMS_LABORATORY_DATABASE_PATH: /app/data/laboratory.db
    volumes:
      - ems-data:/app/data
    restart: unless-stopped
    stop_grace_period: 15s
  chf:
    profiles: [charging]
    build: ./chf
    environment:
      CHF_DATABASE_PATH: /app/data/chf.db
      CHF_DEFAULT_GRANT_BYTES: 10485760
      CHF_VALIDITY_TIME_SECONDS: 300
      CHF_SBI_TOKENS: ${CHF_SBI_TOKENS:-}
    volumes:
      - chf-data:/app/data
    ports:
      - "127.0.0.1:8081:8081"
  chf-admin:
    profiles: [charging]
    build: ./chf
    command: ["hypercorn", "app.main:admin_app", "--bind", "0.0.0.0:8082", "--workers", "1"]
    environment:
      CHF_DATABASE_PATH: /app/data/chf.db
      CHF_ADMIN_TOKEN: ${CHF_ADMIN_TOKEN:-}
    volumes:
      - chf-data:/app/data
    ports:
      - "127.0.0.1:8082:8082"
volumes:
  ems-data:
  chf-data:
